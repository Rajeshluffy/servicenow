# Template only — DO NOT fill in real values here or commit a copy that has
# them. Create the real Secret directly with kubectl instead (never checked
# into git). The Jenkinsfile does this automatically each run from the
# Jenkins Credentials Store; to do it manually:
#
#   kubectl create secret generic servicenow-credentials \
#     --from-literal=SERVICE_NOW_USERNAME=<real value> \
#     --from-literal=SERVICE_NOW_PASSWORD=<real value> \
#     --from-literal=SERVICE_NOW_CLIENT_ID=<real value> \
#     --from-literal=SERVICE_NOW_CLIENT_SECRET=<real value> \
#     -n servicenow
#
# These 4 keys are read directly by ConfigurationManager (same names as the
# Jenkinsfile's Credentials-store entries) — one consistent mechanism across
# Jenkins and Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: servicenow-credentials
  namespace: servicenow
type: Opaque
stringData:
  SERVICE_NOW_USERNAME: "REPLACE_ME"
  SERVICE_NOW_PASSWORD: "REPLACE_ME"
  SERVICE_NOW_CLIENT_ID: "REPLACE_ME"
  SERVICE_NOW_CLIENT_SECRET: "REPLACE_ME"
